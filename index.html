<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO-FAR Learning Portal</title>
<meta name="description" content="Global Oculoplastics – Fellowship and Research: interactive learning dashboard for oculoplastic surgery fellows.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f8b8d'/%3E%3Cpath d='M4 16c4-6 8-8 12-8s8 2 12 8c-4 6-8 8-12 8S8 22 4 16z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <a class="brand" href="#/">
      <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0f8b8d"/><path d="M4 16c4-6 8-8 12-8s8 2 12 8c-4 6-8 8-12 8S8 22 4 16z" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="#fff"/></svg>
      <span><b>GO-FAR</b><small>Learning Portal</small></span>
    </a>
    <nav id="nav" aria-label="Main"></nav>
    <div class="rail-foot">
      <button id="themeBtn" class="ghost" type="button">Toggle theme</button>
      <p>Global Oculoplastics<br>Fellowship &amp; Research</p>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button id="menuBtn" class="icon-btn" aria-label="Menu" type="button">☰</button>
      <form class="search" id="searchForm" role="search">
        <input id="searchInput" type="search" placeholder="Search courses, modules, resources…" aria-label="Search" autocomplete="off">
        <div id="searchResults" class="results" hidden></div>
      </form>
      <button id="userBtn" class="user" type="button" aria-label="Edit profile"></button>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer class="foot">Educational use only. Content is a draft for faculty review and does not replace clinical judgment, institutional protocols or supervised training.</footer>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
